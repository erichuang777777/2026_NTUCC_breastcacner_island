<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8eee5"><title>希望島｜角色設定</title>
<style>
:root{color-scheme:light;--ink:#405653;--rose:#a95771;--sage:#719083;--paper:#fffdf5;--line:#d9ded4}*{box-sizing:border-box}body{margin:0;background:#e8eee5;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}header{padding:25px clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #d8e0d8}header small{letter-spacing:.18em;font-size:10px}h1{font:500 clamp(24px,3vw,34px) Georgia,serif;margin:7px 0 0}a{color:inherit;text-decoration:none}header nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink);padding:11px 15px;font:inherit;cursor:pointer}button:hover{border-color:var(--sage)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bd7187;outline-offset:2px}.primary{background:var(--rose);border-color:var(--rose);color:white;font-weight:600}.layout{max-width:1280px;margin:25px auto;padding:0 22px;display:grid;grid-template-columns:minmax(300px,440px) minmax(370px,1fr);gap:22px}.card{background:var(--paper);border:1px solid #e0e4dc;border-radius:23px;box-shadow:0 12px 34px #4056530c;padding:23px}.card h2{font:500 21px Georgia,serif;margin:0 0 7px}.muted{font-size:13px;line-height:1.7;color:#71827d;margin:0 0 20px}.field{display:grid;gap:7px;margin:15px 0}.field label,.color-grid label{font-size:12px;font-weight:600}.field input,.field select{height:43px;border:1px solid var(--line);border-radius:11px;padding:0 12px;color:var(--ink);background:white;font:inherit}.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.color-grid label{display:grid;gap:6px}.color-grid input{width:100%;height:39px;border:1px solid var(--line);border-radius:10px;background:white;padding:4px}.save-row{display:flex;gap:8px;margin-top:20px}.save-row button{flex:1}.note{padding:12px 14px;background:#f5f0e4;border-radius:13px;font-size:11px;line-height:1.7}.preview{min-height:450px;border-radius:17px;background:linear-gradient(#d9e8e4,#e4e8d4 68%,#cad5c1 68%);position:relative;overflow:hidden}.preview:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#fff7e7aa,#e8ece1aa),url("assets/ntucc-campus-reference.jpg") center 52%/cover;filter:saturate(.72) blur(1px);transform:scale(1.02)}.preview:after{content:"";position:absolute;left:7%;right:7%;bottom:16%;height:20px;border-radius:50%;background:#68837822;filter:blur(7px)}#avatar-preview{position:absolute;inset:0;width:100%;height:100%;z-index:1}.preview-label{position:absolute;z-index:2;left:16px;top:14px;padding:8px 11px;border-radius:20px;background:#fffdf2dc;font-size:11px}.saved{margin-top:18px}.saved-head{display:flex;justify-content:space-between;align-items:center}.saved h3{font-size:14px;font-weight:600}.saved-list{display:grid;gap:8px}.profile{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:14px}.profile strong{display:block;font-size:13px}.profile small{display:block;margin-top:4px;font-size:10px;color:#73827b}.profile-actions{display:flex;gap:5px}.profile-actions button{padding:7px 9px;font-size:11px}.message{min-height:1.6em;font-size:12px;margin:12px 0;color:var(--sage)}footer{max-width:1280px;margin:0 auto;padding:0 22px 30px;font-size:11px;color:#71827d}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8daf95;margin-right:7px}@media(max-width:800px){header{align-items:flex-start;flex-direction:column;padding:18px 20px}.layout{grid-template-columns:1fr;padding:0 14px;margin-top:14px;gap:14px}.card{padding:18px}.preview{min-height:330px}.layout>section:first-child{order:2}.layout>section:last-child{order:1}}

<header><a href="taiwan-study.html"><small>ISLANDS OF HOPE / TAIWAN</small><h1>設定你的島民</h1></a><nav><a href="island-projection.html" target="_blank" rel="noopener"><button type="button">開啟投影畫面</button></a><a href="taiwan-study.html"><button type="button">返回互動地圖</button></a></nav></header>
<main class="layout"><section class="card"><h2>建立角色外觀</h2><p class="muted"><span id="setup-intro">設定角色外觀並儲存草稿；參加活動時，請掃描現場 QR Code 進入。</span></p>
<form id="profile-form"><div class="field"><label for="display-name">角色暱稱</label><input id="display-name" maxlength="18" autocomplete="off" placeholder="例如：小島旅人"></div>
<div class="field"><label for="role">角色樣式</label><select id="role"><option value="visitor">病友・玫瑰頭巾</option><option value="scarf">陪伴者・日常服</option><option value="doctor">醫師・深灰工作服</option><option value="nurse">護理師・深藍制服</option><option value="surgeon">醫師・綠色刷手服</option><option value="scrub">護理師・刷手服與口罩</option></select></div><p id="role-description" class="muted" aria-live="polite"></p>
<div class="field"><label for="style">髮型與配件</label><select id="style"><option value="short">短髮</option><option value="bob">耳下短髮</option><option value="scarf">頭巾</option><option value="cap">手術帽</option><option value="mask">口罩與帽子</option></select></div>
<div class="color-grid"><label>膚色<input id="skin" type="color" value="#edc6a7"></label><label>頭髮／配件<input id="hair" type="color" value="#654738"></label><label>上衣主色<input id="shirt" type="color" value="#cc8a9e"></label><label>褲裝主色<input id="pants" type="color" value="#e6dcc7"></label></div>
<div class="save-row"><button class="primary" type="submit">儲存角色設定</button><button id="reset-form" type="button">重新設定</button></div><p id="message" class="message" role="status"></p><p class="note"><span id="setup-note">請使用暱稱。活動加入後，暱稱與角色會出現在島上。</span></p></form></section>
<section class="card"><div class="preview"><span class="preview-label">即時 3D 預覽・與島上共用模型</span><canvas id="avatar-preview" aria-label="3D 角色外觀預覽"></canvas></div>
<div class="preview-controls" aria-label="角色預覽控制"><button type="button" data-view="0">正面</button><button type="button" data-view="1.57">側面</button><button type="button" data-view="3.14">背面</button><button type="button" id="preview-walk" aria-pressed="false">預覽走路</button></div><p class="muted">使用原定稿的島民造型，預覽與加入後為同一個立體角色。微電影專屬人物會在島上與你相遇。</p><div class="saved"><div class="saved-head"><h3>已儲存的角色草稿</h3><span id="db-status" class="muted"><span class="status-dot"></span>正在連線</span></div><div id="profile-list" class="saved-list"></div></div></section></main>
<footer>角色設定和投影畫面為獨立頁面；投影專用頁不顯示此設定面板。活動流程：掃描 QR Code → 設定角色 → 加入島嶼 → 三題闖關。</footer>
