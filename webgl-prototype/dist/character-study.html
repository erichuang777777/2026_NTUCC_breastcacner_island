<main>
<div class="toolbar" aria-label="角色檢查工具"><div class="control"><label for="version">模型版本</label><select id="version"><option value="director-v15" selected>下顎連續性修訂 v15</option><option value="director-v14">髮根與皮膚接合 v14</option><option value="director-v13">髮型與膚質修訂 v13</option><option value="director-v12">肖像比例校準 v12</option><option value="director-v11">真人細節 v11</option><option value="director-v10">本人照片材質 v10</option><option value="director-v09">五官外觀 v09</option><option value="director-v08">五官細修 v08</option><option value="director-v07">頭部素模 v07</option><option value="director-v06">頭骨重建版 v06</option><option value="director-v05">前版頭型 v05</option><option value="director-v04">已認可正面 v04</option><option value="director-v03">前次修訂版 v03</option><option value="director-v02">目前島上版本</option></select></div><div class="angles" aria-label="觀看角度"><button data-angle="-.16" aria-pressed="true">照片角度</button><button data-angle="0" aria-pressed="false">正面</button><button data-angle="1.57" aria-pressed="false">右側面</button><button data-angle="-1.57" aria-pressed="false">左側面</button><button data-angle=".55" aria-pressed="false">斜側面</button><button data-angle="3.14" aria-pressed="false">背面</button><button id="top-view" aria-pressed="false">俯視頭型</button></div><button id="framing" aria-pressed="false">看全身</button><button id="motion" aria-pressed="false">播放揮手</button><button id="surface" aria-pressed="false">檢查素模</button><button id="capture" disabled>下載角色截圖</button></div>
<div class="comparison"><section><h2>你提供的參考照片</h2><div class="photo stage"><img src="assets/character-study/reference.jpg" alt="用於五官及髮型比對的參考肖像"><span class="guide" aria-hidden="true"></span></div><p>以頭頂、眼睛與下顎的位置比對比例。</p></section><section><h2>獨立 3D 角色 <span id="version-label">獨立修訂版</span></h2><div class="model stage"><canvas id="portrait" aria-label="可旋轉與縮放的立體人物；亦可使用上方角度按鈕" tabindex="0"></canvas><span class="guide" aria-hidden="true"></span><p id="status" role="status">正在載入角色…</p></div><p>拖曳旋轉・滾輪縮放・右鍵平移。預設暫停動作，方便比對。</p></section></div>
<div class="review"><label><input id="guides" type="checkbox"> 顯示水平比對線</label><p>v15 修順下巴到頸部的曲面與膚色過渡，修正貼圖邊緣的細線。可切換 v14 比較；側後方細節為依單張照片延伸的材質，並非本人側面掃描。底模來源：<a href="https://www.makehumancommunity.org/about/license.html" target="_blank" rel="noopener">MakeHuman（CC0）</a>。</p></div>
