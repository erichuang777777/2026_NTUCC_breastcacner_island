<header><small>ISLANDS OF HOPE / TAIWAN</small><h1>臺大癌醫・希望之島</h1><p>十座照護小島，陪你走向希望</p></header>
<nav aria-label="觀看與光線"><button data-view="campus" aria-pressed="true">癌醫希望園區</button><button data-view="island" aria-pressed="true">臺灣全景</button><button data-view="person" aria-pressed="false">看看島民</button><button data-view="sky" aria-pressed="false">看看天空</button><button data-view="tower" aria-pressed="false">看看燈塔</button><button data-view="director" aria-pressed="false">院長迎賓</button><button data-view="hospital" aria-pressed="false">臺大癌醫</button><button id="camera-pan" aria-pressed="false" title="開啟後可用滑鼠左鍵拖曳平移鏡頭">平移鏡頭</button><button id="education-open">衛教清單</button><button id="wish-open">點亮願望</button><button id="night" title="每 10 分鐘完成一輪日夜；點一下預覽另一時段" aria-pressed="false">日夜自動輪替</button><button id="reset">回到起點</button></nav>
<aside class="detail-controls" aria-label="島嶼與角色"><label>探索照護小島<select id="zone"><option value="">臺灣全景</option></select></label><div class="station-tools"><button id="station-open">本站衛教</button><button id="station-enter" hidden>閱讀本站</button></div><label>選擇同行角色<select id="character"></select></label><label>島民數量（模擬）<select id="population"><option value="6">6 位島民・悠閒</option><option value="8" selected>8 位島民・日常</option><option value="12">12 位島民・熱鬧</option></select></label><label>跟隨移動島民<select id="resident-follow"><option value="">選擇島民</option></select></label><label>角色動作<select id="avatar-action"><option value="idle">自然站立</option><option value="reading">閱讀手冊</option><option value="talk">說明與交談</option><option value="nod">點頭回應</option><option value="stretch">舒展身體</option><option value="wish">抬頭許願</option></select></label><button id="avatar-wave" type="button">揮手打招呼</button><output id="crowd-status">8 位島民準備出發</output></aside>
<dialog id="wish-dialog" aria-labelledby="wish-title"><h2 id="wish-title">點亮一顆希望星</h2><button id="wish-close" aria-label="關閉願望視窗">✕</button><form id="wish-form"><label for="wish-text">寫下你的願望</label><textarea id="wish-text" maxlength="200" required placeholder="願每一步，都有人陪伴。"></textarea><button type="submit">點亮希望星</button></form><p id="wish-note"></p><p id="wish-summary"></p><div id="wish-list"></div><button id="wish-demo" type="button">預覽流星（不儲存）</button></dialog>
<dialog id="education-dialog" aria-labelledby="education-title"><h2 id="education-title">各站衛教清單</h2><button id="education-close" aria-label="關閉衛教清單">✕</button><p><a href="event-join.html" target="_blank" rel="noopener">參加當日活動・記錄三題闖關進度</a></p><section class="challenge-box"><p id="challenge-progress">三題理解闖關：尚未通關</p><button id="quiz-start" type="button">三題練習</button></section><label for="education-station">自由瀏覽科別站點</label><select id="education-station"></select><p id="education-progress"></p><div id="education-list" class="education-list"></div><section id="education-detail" hidden></section><p class="draft-note">衛教文章供理解與討論使用；個別篩檢、治療與照護安排，請與醫療團隊確認。</p></dialog>
<div id="pad" aria-label="移動方向"><button data-key="w" aria-label="向前走">↑</button><button data-key="a" aria-label="向左走">←</button><button data-key="s" aria-label="向後走">↓</button><button data-key="d" aria-label="向右走">→</button></div>
<button id="stop-follow" type="button" hidden>停止跟隨島民</button><div id="status" role="status">十座不規則島嶼，以相接的岸邊串起旅程。</div><section id="resident-log" class="resident-log" aria-live="polite"></section><footer>方向鍵走路　·　滾輪／雙指縮放　·　靠近站點按 E 閱讀</footer><div id="loading" role="status">正在拼起十座希望島嶼…</div>
