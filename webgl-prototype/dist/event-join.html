<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf1e8"><title>參加今日活動｜臺大癌醫・希望之島</title><link rel="stylesheet" href="hope-management.css?v=20"></head><body><header class="page-header"><a class="brand" href="taiwan-study.html">臺大癌醫・希望之島</a><a href="taiwan-study.html">自由探索小島</a></header><main class="join-main"><h1>一起走一段希望旅程</h1><p>輸入現場活動代碼，選擇同行角色。三題都答對，就完成今天的闖關。</p><p id="message" role="status" aria-live="polite"></p><section class="join-panel"><form id="join-form"><label for="code">活動代碼</label><input id="code" maxlength="6" minlength="6" required autocomplete="off" autocapitalize="characters" placeholder="現場提供的 6 碼代碼"><label for="name">島民暱稱</label><input id="name" required maxlength="18" autocomplete="off" placeholder="例如：小晴"><p class="hint">暱稱與角色會出現在活動島上，請不要填寫真實姓名或病歷資訊。</p><div class="two-fields"><label>同行角色<select id="role"><option value="visitor">頭巾病友</option><option value="scarf">日常陪伴者</option><option value="doctor">醫師</option><option value="nurse">護理師</option></select></label><label>上衣顏色<input id="color" type="color" value="#b97c87" style="width:100%;height:46px"></label></div><button class="primary">加入活動，開始闖關</button></form><section id="journey" hidden><h2 id="event-name"></h2><p id="welcome"></p><ol id="steps" class="step-list" aria-label="闖關進度"></ol><h2 id="question-title" tabindex="-1"></h2><div id="choices" class="choice-list"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="primary" hidden>下一題</button><a id="complete-link" class="button" href="taiwan-study.html" hidden>回到希望島，點亮願望</a><p id="closed-note" class="hint"></p><button id="leave" type="button">切換活動／下一位參加者</button></section></section><p class="hint">自由瀏覽不需要闖關。活動進度會保留在這個瀏覽器；共用裝置交給下一位前，請先按「切換活動／下一位參加者」。</p></main><script type="module" src="event-join.js?v=20"></script><script type="module" src="hope-menu.js?v=20"></script></body></html>
