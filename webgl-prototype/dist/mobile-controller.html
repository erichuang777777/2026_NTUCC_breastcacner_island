<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf1e8"><title>我的島民搖桿｜希望之島</title><link rel="stylesheet" href="mobile-controller.css?v=23"></head><body><main><header><a href="event-join.html">希望之島</a><span id="connection" role="status">正在連線…</span></header><section id="welcome"><h1 id="resident-name">我的島民</h1><p id="event-title">手機操作，大螢幕一起探索。</p></section><p id="message" role="status" aria-live="polite"></p><section id="join-prompt" hidden><p>請先掃描活動 QR Code，建立自己的島民。</p><a id="join-link" class="button primary" href="event-join.html">選擇活動並加入</a></section><section id="controls" hidden><div class="view-switch" aria-label="手機顯示方式"><button type="button" data-controller-view="map" aria-pressed="true">小地圖</button><button type="button" data-controller-view="pov" aria-pressed="false">角色視角</button></div><div id="pov-card" hidden><p id="pov-loading" role="status">正在載入島上風景…</p></div><div id="map-card" class="map-card"><span class="map-label">你的所在位置</span><svg id="mini-map" viewBox="-17 -31 34 62" role="img" aria-label="臺灣希望島位置小地圖"><g id="map-islands"></g><circle cx="3.75" cy="-2" r="1.1" fill="#fffdf5" stroke="#5a7e71" stroke-width=".3"/><g id="map-others"></g><circle id="my-marker" r="1" fill="#a95771" stroke="white" stroke-width=".45"/></svg><span class="map-compass">↑ 北</span><p id="position-text">正在取得位置</p></div><h2>推動搖桿，讓島民移動</h2><p id="movement-hint" class="hint">方向依上方地圖：上北、下南。放開就停止。</p><div class="joystick-area"><button id="joystick" type="button" aria-label="拖曳搖桿移動角色；也可使用下方方向按鈕"><span class="joystick-ring"></span><span id="stick"></span></button><div class="dpad" aria-label="方向控制"><button type="button" data-dx="0" data-dz="-1" aria-label="向北走">↑</button><button type="button" data-dx="-1" data-dz="0" aria-label="向西走">←</button><button type="button" data-dx="0" data-dz="1" aria-label="向南走">↓</button><button type="button" data-dx="1" data-dz="0" aria-label="向東走">→</button></div></div><nav class="actions"><a id="challenge-link" class="button primary" href="event-join.html">衛教闖關</a><button id="release-control" type="button">結束操控</button></nav><p class="hint">目前支援 7 位同時操控。離開畫面會立即停止移動，90 秒未連線後釋出操控名額。</p></section></main><script type="module" src="mobile-controller.js?v=23"></script></body></html>
