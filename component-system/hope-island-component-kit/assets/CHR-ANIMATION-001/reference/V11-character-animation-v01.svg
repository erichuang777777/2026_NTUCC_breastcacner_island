<rect width="3840" height="2160" fill="url(#b)"/><circle cx="180" cy="160" r="62" fill="#8e9b7b"/><path d="M145 160l25 25 49-53" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/><text x="280" y="145" class="h1">V11｜角色方向與動作規格</text><text x="282" y="200" class="body muted">一套基礎角色骨架｜八方向走位＋常用互動動作</text>
