<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3840" height="2160" viewBox="0 0 3840 2160">
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#f7f2ea"/><stop offset="1" stop-color="#e9e0d6"/></linearGradient><style>text{font-family:'Noto Sans TC Thin','Noto Sans TC',sans-serif;fill:#3d545a}.h1{font-size:68px;font-weight:700}.h2{font-size:40px;font-weight:700}.h3{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:20px}.muted{fill:#819093}.white{fill:white}</style></defs>
<rect width="3840" height="2160" fill="url(#b)"/><circle cx="180" cy="160" r="62" fill="#bd8d91"/><circle cx="180" cy="145" r="18" fill="#fff"/><path d="M140 198c9-34 71-34 80 0" fill="#fff"/>
<text x="280" y="145" class="h1">V10｜島民與照護團隊角色服裝</text><text x="282" y="200" class="body muted">同一角色比例與材質語言｜用服裝剪影快速辨識身份</text>
<rect x="170" y="295" width="2650" height="1570" rx="52" fill="#fff" opacity=".86"/><image x="205" y="325" width="2580" height="1510" preserveAspectRatio="xMidYMid meet" xlink:href="v10-character-outfits.png"/>
<g transform="translate(2880 300)"><rect width="780" height="700" rx="48" fill="#fff"/><text x="50" y="76" class="h2">角色類型</text><g transform="translate(52 130)"><circle cx="16" cy="20" r="15" fill="#bd8d91"/><text x="54" y="29" class="body">病人｜40–50歲、頭巾造型可選</text><circle cx="16" cy="92" r="15" fill="#174d3b"/><text x="54" y="101" class="body">手術醫師｜40–50歲、深綠刷手服</text><circle cx="16" cy="164" r="15" fill="#44474b"/><text x="54" y="173" class="body">醫師｜40–50歲、深灰工作服</text><circle cx="16" cy="236" r="15" fill="#172f55"/><text x="54" y="245" class="body">護理師｜20–30歲、深藍工作服</text><circle cx="16" cy="308" r="15" fill="#174d3b"/><text x="54" y="317" class="body">刷手護理師｜20–30歲、深綠服</text><circle cx="16" cy="380" r="15" fill="#d5b697"/><text x="54" y="389" class="body">病人外觀保留多種選項</text></g><rect x="52" y="560" width="676" height="92" rx="30" fill="#e9eee4"/><text x="390" y="618" text-anchor="middle" class="small">頭巾、帽子與識別證可拆件</text></g>
<g transform="translate(2880 1050)"><rect width="780" height="815" rx="48" fill="#536b70"/><text x="50" y="82" class="h2 white">共用角色規格</text><text x="50" y="145" class="small white" opacity=".75">套用於所有職類，維持一致視覺</text><g transform="translate(50 205)" class="white"><text x="0" y="25" class="body white">• 頭身比約 1.8–2.0</text><text x="0" y="90" class="body white">• 頭巾、髮型與帽子可替換</text><text x="0" y="155" class="body white">• 醫師／病人約 40–50 歲</text><text x="0" y="220" class="body white">• 護理工作人員約 20–30 歲</text><text x="0" y="285" class="body white">• 成熟友善，避免病情刻板描寫</text></g><rect x="50" y="550" width="680" height="180" rx="30" fill="#fff" opacity=".12"/><text x="84" y="610" class="small white">院內服裝色</text><text x="84" y="662" class="body white">深綠刷手服｜深藍護理服</text><text x="84" y="705" class="body white">深灰醫師工作服</text></g>
<text x="170" y="1980" class="small muted">V10 概念稿：目前用於確認身份剪影、服裝色塊與角色比例；不是最終模型網格。</text></svg>
