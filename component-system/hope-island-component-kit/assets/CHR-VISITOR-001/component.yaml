review:
  content_owner: "活動企劃／網站團隊"
  visual_reviewer: null
  medical_reviewer: "不適用；若角色承載衛教訊息需另審"
  approved_at: null
  notes: ["v0.2 程序化模型預覽仍過於積木化，未部署至網站。", "v0.3 候選形體由透明背景單人 A-pose 美術輸入經 Hunyuan3D-2 產生，頭巾、開襟衫、手掌與人體比例已明顯接近參考圖。", "v0.3 貼圖候選已具備玫瑰色頭巾與外套、奶油色上衣、藍色長褲、大眼五官及白鞋；手部邊緣與胸前緞帶仍有貼圖瑕疵。", "一般 Collapse 降面會破壞此模型 UV，LOD v02 已拒絕使用。", "Meshoptimizer v03 以 UV／法線等頂點屬性參與簡化；LOD0 與 LOD2 預覽均無黑面。", "Bone Heat 自動權重失敗版本已拒絕；改用所有頂點皆有歸屬的空間區域權重後，GLB 已驗證 1 組 skin、18 根骨骼及 idle／walk 兩段動畫。", "7.77 MB 量化 Meshopt 版在 Three.js 發生 skin 爆模，已拒絕；12.86 MB 無量化 Meshopt 版通過瀏覽器高度、腳底、動畫與單一世界稽核。", "v2.3.10 將走路動畫改為依實際位移觸發，並讓地圖目的地直接移動島民到同一世界中的安全入口；瀏覽器重新載入稽核待下一輪執行。"]
