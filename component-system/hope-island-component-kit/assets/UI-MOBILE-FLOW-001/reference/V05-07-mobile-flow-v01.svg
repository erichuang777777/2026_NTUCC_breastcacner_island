<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5eee5"/><stop offset="1" stop-color="#e8ded3"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38535b" stop-opacity=".05"/><stop offset="1" stop-color="#203c43" stop-opacity=".78"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#33464a" flood-opacity=".22"/></filter>
    <filter id="smallshadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#33464a" flood-opacity=".18"/></filter>
    <clipPath id="s1"><rect x="250" y="325" width="920" height="1600" rx="88"/></clipPath>
    <clipPath id="s2"><rect x="1460" y="325" width="920" height="1600" rx="88"/></clipPath>
    <clipPath id="s3"><rect x="2670" y="325" width="920" height="1600" rx="88"/></clipPath>
    <style>
      text{font-family:'Noto Sans TC Thin','Noto Sans TC',sans-serif;fill:#385058}
      .h1{font-size:68px;font-weight:700}.h2{font-size:38px;font-weight:700}.h3{font-size:28px;font-weight:700}.body{font-size:25px}.small{font-size:20px}.tiny{font-size:17px}.white{fill:white}.muted{fill:#7b8b8e}.rose{fill:#bd8d91}.sage{fill:#8e9b7b}
    </style>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <circle cx="180" cy="160" r="62" fill="#bd8d91"/><path d="M151 157c0-28 23-51 51-51-17 13-22 31-15 52 6 19 4 36-7 50-17-11-29-29-29-51z" fill="#fff"/>
  <text x="280" y="145" class="h1">V05–V07｜行動端體驗流程</text>
  <text x="282" y="200" class="body muted">探索島嶼 → 理解科部 → 看見自己的個人化照護路徑</text>
  <g transform="translate(2980 105)"><rect width="600" height="94" rx="47" fill="#fff" opacity=".82"/><circle cx="56" cy="47" r="18" fill="#8e9b7b"/><text x="92" y="58" class="body">第三人稱預設｜可切第一人稱</text></g>

  <!-- phone 1 -->
  <rect x="225" y="300" width="970" height="1650" rx="112" fill="#334b52" filter="url(#shadow)"/>
  <g clip-path="url(#s1)">
    <image x="250" y="325" width="920" height="1600" preserveAspectRatio="xMidYMid slice" xlink:href="scene-mobile-pathology.png"/>
    <rect x="250" y="325" width="920" height="1600" fill="url(#dark)"/>
    <rect x="286" y="365" width="430" height="112" rx="56" fill="#fff" opacity=".92"/>
    <circle cx="346" cy="421" r="40" fill="#d7b0ad"/><circle cx="346" cy="408" r="16" fill="#745a4e"/><path d="M320 447c8-22 44-22 52 0" fill="#8e9b7b"/>
    <text x="406" y="408" class="small muted">希望島民 018</text><text x="406" y="446" class="h3">探索中</text>
    <g transform="translate(935 365)"><circle cx="92" cy="92" r="92" fill="#fff" opacity=".92"/><path d="M31 98l61-43 61 43-61 43z" fill="#d9e1d4"/><circle cx="92" cy="95" r="12" fill="#bd8d91"/><path d="M92 38v18M92 134v18M35 95h18M131 95h18" stroke="#60777b" stroke-width="5"/></g>
    <g transform="translate(330 920)"><rect width="520" height="142" rx="42" fill="#fff" opacity=".94" filter="url(#smallshadow)"/><circle cx="70" cy="71" r="24" fill="#8daab4"/><text x="116" y="59" class="small muted">靠近</text><text x="116" y="103" class="h2">病理科小屋</text></g>
    <g transform="translate(305 1600)" opacity=".9"><circle cx="132" cy="132" r="116" fill="#fff" opacity=".36"/><circle cx="132" cy="132" r="55" fill="#fff" opacity=".72"/><path d="M132 65l-24 38h48zM132 199l-24-38h48zM65 132l38-24v48zM199 132l-38-24v48z" fill="#4e6b71" opacity=".8"/></g>
    <g transform="translate(910 1600)"><circle cx="120" cy="120" r="110" fill="#bd8d91" opacity=".94"/><path d="M85 118h70M120 83v70" stroke="#fff" stroke-width="12" stroke-linecap="round"/><text x="120" y="278" text-anchor="middle" class="small white">了解</text></g>
    <g transform="translate(495 1812)"><rect width="430" height="72" rx="36" fill="#fff" opacity=".9"/><circle cx="42" cy="36" r="12" fill="#8e9b7b"/><text x="72" y="47" class="small">已同步到現場大螢幕</text></g>
  </g>
  <text x="710" y="2030" text-anchor="middle" class="h2">V05｜島內探索</text><text x="710" y="2074" text-anchor="middle" class="small muted">大人物、小建築；四角保留操作區</text>

  <!-- phone 2 -->
  <rect x="1435" y="300" width="970" height="1650" rx="112" fill="#334b52" filter="url(#shadow)"/>
  <g clip-path="url(#s2)">
    <image x="1460" y="325" width="920" height="690" preserveAspectRatio="xMidYMid slice" xlink:href="scene-mobile-pathology.png"/>
    <rect x="1460" y="325" width="920" height="690" fill="#29444b" opacity=".26"/>
    <rect x="1460" y="880" width="920" height="1045" rx="72" fill="#fbf8f2"/>
    <rect x="1505" y="365" width="286" height="74" rx="37" fill="#fff" opacity=".92"/><text x="1648" y="414" text-anchor="middle" class="small">← 返回島嶼</text>
    <g transform="translate(1520 795)"><rect width="800" height="168" rx="48" fill="#fff" filter="url(#smallshadow)"/><circle cx="92" cy="84" r="56" fill="#8daab4"/><path d="M65 90c16-37 46-42 68-19M88 61l31 57M77 111h62" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/><text x="176" y="72" class="small muted">診斷的關鍵團隊</text><text x="176" y="124" class="h1">病理科</text></g>
    <text x="1535" y="1040" class="h3">這個團隊做什麼？</text>
    <text x="1535" y="1088" class="body"><tspan x="1535" dy="0">檢視組織、細胞與玻片，確認腫瘤類型、</tspan><tspan x="1535" dy="42">重要特徵與診斷資訊。</tspan></text>
    <rect x="1535" y="1185" width="770" height="152" rx="34" fill="#e9eee4"/><circle cx="1590" cy="1260" r="24" fill="#8e9b7b"/><text x="1635" y="1238" class="small muted">為什麼重要？</text><text x="1635" y="1282" class="body">病理報告會協助團隊討論後續治療。</text>
    <text x="1535" y="1415" class="h3">我想知道</text>
    <g transform="translate(1535 1455)"><rect width="360" height="108" rx="30" fill="#fff" stroke="#d8cbc0" stroke-width="3"/><text x="180" y="45" text-anchor="middle" class="small"><tspan x="180">我會做什麼</tspan><tspan x="180" dy="34">檢查？</tspan></text><rect x="390" width="380" height="108" rx="30" fill="#fff" stroke="#d8cbc0" stroke-width="3"/><text x="580" y="45" text-anchor="middle" class="small"><tspan x="580">病理報告</tspan><tspan x="580" dy="34">會告訴我什麼？</tspan></text></g>
    <g transform="translate(1535 1590)"><rect width="770" height="108" rx="54" fill="#bd8d91"/><text x="385" y="68" text-anchor="middle" class="h3 white">完成這一站的衛教　＋1 枚徽章</text></g>
    <g transform="translate(1535 1735)"><rect width="770" height="104" rx="28" fill="#f0e7df"/><text x="38" y="44" class="small muted">接下來可能遇見</text><text x="38" y="79" class="body">多專科團隊討論 → 依個別狀況安排治療</text></g>
  </g>
  <text x="1920" y="2030" text-anchor="middle" class="h2">V06｜科部衛教</text><text x="1920" y="2074" text-anchor="middle" class="small muted">每站固定：做什麼、為何重要、常見問題</text>

  <!-- phone 3 -->
  <rect x="2645" y="300" width="970" height="1650" rx="112" fill="#334b52" filter="url(#shadow)"/>
  <g clip-path="url(#s3)">
    <rect x="2670" y="325" width="920" height="1600" fill="#fbf8f2"/>
    <rect x="2670" y="325" width="920" height="230" fill="#6d8585"/>
    <text x="2740" y="405" class="small white" opacity=".8">希望島民 018</text><text x="2740" y="478" class="h1 white">我的照護旅程</text>
    <g transform="translate(3370 370)"><circle cx="70" cy="70" r="70" fill="#fff" opacity=".18"/><path d="M38 71l22 22 43-48" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/></g>
    <rect x="2730" y="600" width="800" height="132" rx="32" fill="#e8eee5"/><text x="2775" y="652" class="small muted">目前進度</text><text x="2775" y="700" class="h3">已理解 3 個團隊｜下一站：多專科中心</text>
    <path d="M2830 835V1265" stroke="#c6d0c2" stroke-width="14" stroke-linecap="round"/>
    <g>
      <circle cx="2830" cy="835" r="44" fill="#8e9b7b"/><path d="M2810 835l14 14 29-31" stroke="#fff" stroke-width="8" fill="none"/><text x="2910" y="825" class="h3">篩檢與風險</text><text x="2910" y="864" class="small muted">家醫科</text>
      <circle cx="2830" cy="965" r="44" fill="#8e9b7b"/><path d="M2810 965l14 14 29-31" stroke="#fff" stroke-width="8" fill="none"/><text x="2910" y="955" class="h3">影像檢查</text><text x="2910" y="994" class="small muted">放射診斷科</text>
      <circle cx="2830" cy="1095" r="44" fill="#8e9b7b"/><path d="M2810 1095l14 14 29-31" stroke="#fff" stroke-width="8" fill="none"/><text x="2910" y="1085" class="h3">確認診斷</text><text x="2910" y="1124" class="small muted">病理科</text>
      <circle cx="2830" cy="1265" r="54" fill="#bd8d91"/><circle cx="2830" cy="1265" r="18" fill="#fff"/><text x="2910" y="1255" class="h3">多專科共同討論</text><text x="2910" y="1294" class="small muted">和病人一起決定下一段路</text>
    </g>
    <text x="2730" y="1400" class="h3">後續是個人化分支，不是固定順序</text>
    <g transform="translate(2730 1440)">
      <rect width="248" height="90" rx="28" fill="#eee3dc"/><text x="124" y="56" text-anchor="middle" class="body">手術治療</text>
      <rect x="276" width="248" height="90" rx="28" fill="#e6ebdf"/><text x="400" y="56" text-anchor="middle" class="body">全身性治療</text>
      <rect x="552" width="248" height="90" rx="28" fill="#e2e9eb"/><text x="676" y="56" text-anchor="middle" class="body">放射治療</text>
      <rect y="118" width="248" height="90" rx="28" fill="#efe0e2"/><text x="124" y="174" text-anchor="middle" class="body">乳房重建</text>
      <rect x="276" y="118" width="248" height="90" rx="28" fill="#e7e1d8"/><text x="400" y="174" text-anchor="middle" class="body">心臟評估</text>
      <rect x="552" y="118" width="248" height="90" rx="28" fill="#e3eadf"/><text x="676" y="174" text-anchor="middle" class="body">復健支持</text>
    </g>
    <rect x="2730" y="1720" width="800" height="138" rx="30" fill="#fff" stroke="#dfd3c7" stroke-width="3"/><text x="2770" y="1772" class="small muted">提醒</text><text x="2770" y="1818" class="body">實際安排依疾病分期、腫瘤特性與個人需求決定。</text>
  </g>
  <text x="3130" y="2030" text-anchor="middle" class="h2">V07｜個人照護旅程</text><text x="3130" y="2074" text-anchor="middle" class="small muted">進度可理解，但不暗示所有人走同一條路</text>
</svg>
