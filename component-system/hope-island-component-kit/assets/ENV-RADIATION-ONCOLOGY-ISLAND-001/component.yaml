review:
  notes:
    - "地形、治療中心、衛教標靶亭、植栽與設施必須維持獨立網格。"
    - "入口、中央廣場、碼頭與兩側聯島橋必須保持可通行。"
    - "治療設備僅作為非威脅性的醫療環境展示，不與建築外殼融合。"
    - "v03 以單一連續拱頂取代 v02 橢球拼接屋頂，窗格沿橢圓立面排列，保留可見的放療機、病床、標靶識別與無障礙坡道。"
