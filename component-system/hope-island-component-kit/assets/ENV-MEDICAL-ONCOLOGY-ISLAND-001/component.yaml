review:
  notes:
    - "島體、輸液治療館與庭園物件必須保持獨立網格。"
    - "禁止建立點入小島後的第二場景。"
    - "v03 修正外側窗格固定直線造成的懸空，改為沿橢圓立面排列；簡化多層屋頂並降低中央弧頂，保留輸液治療專屬物件。"
    - "v04 依電影海報重建較寬的中央識別牆、石材簷口、弧頂金屬肋條、深窗框與入口花台，並提高單一世界中的建築占比。"
    - "景觀 v01 將岩岸、草地、步道、療癒亭、櫻花、常綠樹、花圃、燈具與座椅拆成獨立模型，再與 v04 建築組回同一個連續世界。"
    - "景觀 v02 移除與宏觀島體重疊的地形殼，只保留可貼合舊島面的景觀元件，修正實機畫面中的雙層浮空島。"
