<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f3ec"/><stop offset="1" stop-color="#ece3d9"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#46565a" flood-opacity=".18"/></filter>
    <style>text{font-family:'Noto Sans TC Thin','Noto Sans TC',sans-serif;fill:#3d545a}.h1{font-size:68px;font-weight:700}.h2{font-size:40px;font-weight:700}.h3{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:20px}.muted{fill:#7d8c8e}.white{fill:#fff}</style>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <circle cx="180" cy="160" r="62" fill="#8fa17e"/><path d="M145 176h70M180 132v88M158 146l22-22 22 22" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/>
  <text x="280" y="145" class="h1">V08–V09｜科部小屋模組與多角度</text>
  <text x="282" y="200" class="body muted">代表物件：病理科小屋｜共用骨架 70% ＋ 科部特色 30%</text>
  <g transform="translate(2870 102)"><rect width="710" height="96" rx="48" fill="#fff" opacity=".86"/><text x="355" y="61" text-anchor="middle" class="body">低模、圓角、霧面材質｜Three.js / Blender 友善</text></g>

  <rect x="170" y="295" width="2480" height="1640" rx="64" fill="#fff" opacity=".9" filter="url(#shadow)"/>
  <image x="215" y="340" width="2390" height="1510" preserveAspectRatio="xMidYMid meet" xlink:href="pathology-cottage-multiview.png"/>
  <g transform="translate(235 1810)"><rect width="620" height="78" rx="39" fill="#51696e" opacity=".92"/><text x="310" y="51" text-anchor="middle" class="small white">概念多角度｜建模前再輸出正式正交圖</text></g>

  <g transform="translate(2740 300)">
    <rect width="930" height="580" rx="48" fill="#fff" filter="url(#shadow)"/>
    <text x="54" y="72" class="h2">V08｜七個可重用模組</text>
    <g transform="translate(54 112)">
      <circle cx="22" cy="20" r="18" fill="#bd8d91"/><text x="58" y="29" class="body">A　六角島底座與接橋點</text>
      <circle cx="22" cy="82" r="18" fill="#8fa17e"/><text x="58" y="91" class="body">B　建築核心與碰撞體</text>
      <circle cx="22" cy="144" r="18" fill="#8daab4"/><text x="58" y="153" class="body">C　屋頂／採光罩</text>
      <circle cx="22" cy="206" r="18" fill="#cbb59e"/><text x="58" y="215" class="body">D　入口門廊</text>
      <circle cx="22" cy="268" r="18" fill="#b6a6b5"/><text x="58" y="277" class="body">E　科部展示窗</text>
      <circle cx="22" cy="330" r="18" fill="#d2a3a0"/><text x="58" y="339" class="body">F　科部識別塔／圖騰</text>
      <circle cx="22" cy="392" r="18" fill="#91a57d"/><text x="58" y="401" class="body">G　植栽、座椅、燈具</text>
    </g>
  </g>
  <g transform="translate(2740 930)">
    <rect width="930" height="455" rx="48" fill="#fff" filter="url(#shadow)"/>
    <text x="54" y="72" class="h2">V09｜建模視角要求</text>
    <g transform="translate(54 112)">
      <text x="0" y="28" class="body">01　前 3/4：確認整體比例與識別性</text>
      <text x="0" y="88" class="body">02　左／右側：確認開窗與模組接縫</text>
      <text x="0" y="148" class="body">03　後視：設備箱與低細節背面</text>
      <text x="0" y="208" class="body">04　俯視：六角邊界、屋頂與動線</text>
      <text x="0" y="268" class="body">05　爆炸圖：模組命名與替換方式</text>
    </g>
  </g>
  <g transform="translate(2740 1435)">
    <rect width="930" height="500" rx="48" fill="#536b70"/>
    <text x="54" y="72" class="h2 white">建議初始技術預算</text>
    <text x="54" y="130" class="small white" opacity=".72">正式製作前可再依終端測試調整</text>
    <g transform="translate(54 180)">
      <rect width="390" height="92" rx="28" fill="#fff" opacity=".12"/><text x="28" y="38" class="small white">LOD0</text><text x="28" y="72" class="body white">15–25k triangles</text>
      <rect x="430" width="390" height="92" rx="28" fill="#fff" opacity=".12"/><text x="458" y="38" class="small white">LOD1</text><text x="458" y="72" class="body white">5–8k triangles</text>
      <rect y="122" width="390" height="92" rx="28" fill="#fff" opacity=".12"/><text x="28" y="160" class="small white">材質</text><text x="28" y="194" class="body white">1 張 1K atlas</text>
      <rect x="430" y="122" width="390" height="92" rx="28" fill="#fff" opacity=".12"/><text x="458" y="160" class="small white">輸出</text><text x="458" y="194" class="body white">GLB + Draco / KTX2</text>
    </g>
    <text x="54" y="445" class="small white" opacity=".86">Pivot 固定在六角中心底面｜碰撞體以簡化盒／膠囊為主</text>
  </g>
</svg>
