review:
  content_owner: "活動企劃／網站團隊"
  visual_reviewer: null
  approved_at: null
  notes:
    - "舊 delivery_glb 仍是低模島嶼；尚未被候選建築取代。"
    - "v02 單視圖 Hunyuan 幾何把屋頂誤判為大型凹槽，已拒絕整合。"
    - "v03 改用四視圖藍圖與 Blender 分件重建，屋頂、中央入口、左右翼、窗框和石材基座皆可獨立編修。"
    - "v03 目前為結構候選，左右翼曲率、PBR 貼圖和電影海報鏡位仍待下一輪驗收；不得視為正式交付。"
    - "v04 增加石材與金屬程序式微表面、三層屋頂立縫、弧形窗列與夜間室內光，仍須經島體整合與網頁實機驗收。"
    - "v04 屋頂立縫在平頂上呈欄杆狀，已拒絕整合；v05 將三層翼頂改為封閉斜面截錐並讓立縫貼合坡面。"
    - "網站 v2.6.1 已移除含白色展示底板與坡道的組裝島，改為只載入獨立病理中心建築；島體、道路與橋梁沿用同一個全島連續世界。"
    - "v06 依單島海報重整量體：左右翼改為低矮大圓角、單層鼠尾草綠屋頂、弧形玻璃幕牆，中央入口改為與牆體相連的圓角冠部；已拒絕第一張懸浮筒頂試算。"
    - "網站 v2.6.3 加入獨立病理島庭園元件 v01：櫻花與常綠樹、五組花圃、展示亭、長椅、庭園燈及入口步道；不與建築或島體烘焙成單一模型。"
    - "網站 v2.6.4 補回獨立病理島草地與岩岸地形，修正實機放大時建築與庭園看似浮在海面上的問題。"
    - "網站 v2.6.5 移除病理中心所有材質的白色 emissiveMap 覆寫，改為極低暖色補光，保留石材、玻璃與鼠尾草綠屋頂的原始色彩。"
    - "瀏覽器稽核：新資產 loaded=true、legacyVisible=false、singleWorld=true；12/12 直接切換落點可行走且 blocker=null。"
    - "執行期截圖：webgl-prototype/runtime-pathology-v05-focus-settled.png。"
