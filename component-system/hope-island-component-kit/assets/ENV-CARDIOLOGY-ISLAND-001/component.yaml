review:
  notes:
    - "地形、心臟評估中心、衛教亭、植栽與設施必須維持獨立網格。"
    - "入口、雙側坡道、中央廣場、碼頭與聯島橋必須保持可通行。"
    - "心臟超音波設備以安心、非威脅性的臨床空間呈現。"
    - "v03 壓低並拉寬雙瓣心形屋頂，加入中央凹口；窗格改為沿橢圓立面排列，保留超音波診間與雙側坡道。"
