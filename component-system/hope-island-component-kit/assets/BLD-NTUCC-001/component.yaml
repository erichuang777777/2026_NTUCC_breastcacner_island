  notes:
    - "v03 為清晰結構候選，包含九段弧形幕牆、水平樓板帶、兩側臨床翼樓、圓形玻璃門廳、弧形到院雨棚與屋頂空調設備。"
    - "尚未取代網站正式臺大癌醫模型；必須先完成比例、島體配置、碰撞與瀏覽器實景驗收。"
    - "v04 將倒角分段最佳化後由 55452 降至 14124 三角形，GLB 由 3.7 MB 降至約 1.1 MB。"
    - "網站 v2.4.1 已隱藏舊 ntucc-hi 模型並在同一世界座標載入 v04；仍待瀏覽器實景驗證。"
    - "v2.4.1 實景驗證發現全域發光使外牆泛白；v2.4.2 改為只有 warm-interior 材質參與夜間發光。"
    - "v2.4.3 將臺大癌醫聚焦倍率由 0.70 調整為 1.18，使新版建築在同一世界中可清楚檢視。"
