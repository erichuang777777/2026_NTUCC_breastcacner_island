<rect width="3840" height="2160" fill="url(#b)"/><circle cx="180" cy="160" r="62" fill="#8daab4"/><path d="M130 166c30-36 70-36 100 0" stroke="#fff" stroke-width="10" fill="none"/><text x="280" y="145" class="h1">V12｜希望之島環境道具套件</text><text x="282" y="200" class="body muted">道具採模組化、可重複配置，讓九座科部島看起來同屬一個世界</text>
