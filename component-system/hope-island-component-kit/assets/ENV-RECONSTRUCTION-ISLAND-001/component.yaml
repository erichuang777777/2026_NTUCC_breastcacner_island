review:
  notes:
    - "島體、花瓣屋頂重建中心、無障礙坡道與庭園物件必須維持獨立網格。"
    - "入口、中央廣場、碼頭與兩側聯島橋必須維持可通行。"
    - "v03 將懸空直線窗格改為沿橢圓立面排列，降低中央花苞並將五片屋頂花瓣向左右展開，移除 v02 疊盤式輪廓。"
