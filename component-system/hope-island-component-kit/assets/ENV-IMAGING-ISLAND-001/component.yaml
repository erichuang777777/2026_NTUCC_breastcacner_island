review:
  notes:
    - "禁止將完整電影圖一次轉成黏合模型。"
    - "各元件須保留高模與網頁 LOD，並以相同座標原點重新組裝。"
    - "完成判準為全島鏡頭構圖、材質與光線對照電影參考圖，而非單一模型存在。"
    - "v03 依電影參考圖重整低矮圓角雙翼與藍灰屋頂，加入影像掃描環、訊號波紋、診斷床與螢幕；保留既有獨立地形與庭園元件。"
